<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Dashboard</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 40px;
            background: #f4f6f8;
        }

        .contenedor {
            max-width: 1100px;
            margin: auto;
        }

        h1 {
            margin-bottom: 30px;
        }

        .tarjetas {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }

        .tarjeta {
            background: white;
            padding: 25px;
            border-radius: 12px;
            flex: 1;
            min-width: 200px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .numero {
            font-size: 32px;
            font-weight: bold;
            margin-top: 10px;
        }
    </style>
</head>

<body>

<div class="contenedor">

    <h1>Mi Dashboard</h1>

    <div class="tarjetas">

        <div class="tarjeta">
            <div>Documentos</div>
            <div class="numero">10</div>
        </div>

        <div class="tarjeta">
            <div>Importe total</div>
            <div class="numero">S/ 20,840.40</div>
        </div>

        <div class="tarjeta">
            <div>Ingresados</div>
            <div class="numero">4</div>
        </div>

        <div class="tarjeta">
            <div>Modificados</div>
            <div class="numero">6</div>
        </div>

    </div>

</div>

</body>
</html>
