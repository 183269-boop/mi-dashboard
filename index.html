```html
<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dashboard de Movimientos</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial, Helvetica, sans-serif;
    background:#f4f6f9;
    color:#1f2937;
}

.contenedor{
    max-width:1400px;
    margin:auto;
    padding:35px;
}

h1{
    margin-bottom:8px;
}

.subtitulo{
    color:#6b7280;
    margin-bottom:30px;
}


/* =========================
   FILTROS
========================= */

.filtros{

    background:white;

    padding:22px;

    border-radius:12px;

    box-shadow:0 2px 10px rgba(0,0,0,.08);

    margin-bottom:25px;

}

.filtros-titulo{

    font-size:18px;

    font-weight:bold;

    margin-bottom:18px;

}

.filtros-grid{

    display:grid;

    grid-template-columns:
        repeat(3, 1fr);

    gap:20px;

}

.filtro label{

    display:block;

    font-size:13px;

    font-weight:bold;

    color:#4b5563;

    margin-bottom:7px;

}

.filtro select{

    width:100%;

    padding:11px;

    border:1px solid #d1d5db;

    border-radius:8px;

    background:white;

    font-size:14px;

    cursor:pointer;

}

.filtro select:focus{

    outline:none;

    border-color:#2563eb;

}


/* BOTON LIMPIAR */

.btn-limpiar{

    margin-top:18px;

    padding:10px 18px;

    border:none;

    border-radius:8px;

    background:#e5e7eb;

    color:#374151;

    font-weight:bold;

    cursor:pointer;

}

.btn-limpiar:hover{

    background:#d1d5db;

}


/* =========================
   TARJETAS
========================= */

.tarjetas{

    display:grid;

    grid-template-columns:
        repeat(4,1fr);

    gap:18px;

    margin-bottom:25px;

}

.tarjeta{

    background:white;

    padding:22px;

    border-radius:12px;

    box-shadow:0 2px 10px rgba(0,0,0,.08);

}

.titulo{

    color:#6b7280;

    font-size:13px;

}

.numero{

    font-size:28px;

    font-weight:bold;

    margin-top:8px;

}


/* =========================
   TABLA
========================= */

.tabla-contenedor{

    background:white;

    padding:22px;

    border-radius:12px;

    box-shadow:0 2px 10px rgba(0,0,0,.08);

    overflow-x:auto;

}

.tabla-contenedor h2{

    margin-top:0;

}

table{

    width:100%;

    border-collapse:collapse;

    font-size:13px;

}

th,
td{

    padding:12px;

    border-bottom:1px solid #e5e7eb;

    text-align:left;

    white-space:nowrap;

}

th{

    background:#f3f4f6;

    font-weight:bold;

}

tr:hover td{

    background:#f9fafb;

}

.cargando{

    text-align:center;

    padding:25px;

    color:#6b7280;

}


/* =========================
   RESPONSIVE
========================= */

@media(max-width:900px){

    .filtros-grid{

        grid-template-columns:1fr;

    }

    .tarjetas{

        grid-template-columns:
            repeat(2,1fr);

    }

}

</style>

</head>


<body>


<div class="contenedor">


    <h1>Dashboard de Movimientos</h1>

    <div class="subtitulo">
        Control y seguimiento de documentos
    </div>


    <!-- =========================
         FILTROS
    ========================= -->

    <div class="filtros">

        <div class="filtros-titulo">
            Filtros
        </div>


        <div class="filtros-grid">


            <!-- PROVEEDOR -->

            <div class="filtro">

                <label>
                    PROVEEDOR
                </label>

                <select
                    id="filtroProveedor"
                    onchange="aplicarFiltros()">

                    <option value="">
                        Todos los proveedores
                    </option>

                </select>

            </div>


            <!-- CLIENTE -->

            <div class="filtro">

                <label>
                    CLIENTE
                </label>

                <select
                    id="filtroCliente"
                    onchange="aplicarFiltros()">

                    <option value="">
                        Todos los clientes
                    </option>

                </select>

            </div>


            <!-- ESTADO -->

            <div class="filtro">

                <label>
                    ESTADO
                </label>

                <select
                    id="filtroEstado"
                    onchange="aplicarFiltros()">

                    <option value="">
                        Todos los estados
                    </option>

                </select>

            </div>


        </div>


        <button
            class="btn-limpiar"
            onclick="limpiarFiltros()">

            Limpiar filtros

        </button>

    </div>



    <!-- =========================
         TARJETAS
    ========================= -->

    <div class="tarjetas">


        <div class="tarjeta">

            <div class="titulo">
                Documentos
            </div>

            <div
                class="numero"
                id="documentos">

                -

            </div>

        </div>


        <div class="tarjeta">

            <div class="titulo">
                Importe total
            </div>

            <div
                class="numero"
                id="importe">

                -

            </div>

        </div>


        <div class="tarjeta">

            <div class="titulo">
                Ingresados
            </div>

            <div
                class="numero"
                id="ingresados">

                -

            </div>

        </div>


        <div class="tarjeta">

            <div class="titulo">
                Modificados
            </div>

            <div
                class="numero"
                id="modificados">

                -

            </div>

        </div>


    </div>



    <!-- =========================
         TABLA
    ========================= -->

    <div class="tabla-contenedor">


        <h2>
            Movimientos
        </h2>


        <div
            id="cargando"
            class="cargando">

            Cargando datos...

        </div>


        <table
            id="tabla"
            style="display:none;">


            <thead>

                <tr>

                    <th>Documento</th>

                    <th>Movimiento</th>

                    <th>Tipo</th>

                    <th>Fecha</th>

                    <th>Moneda</th>

                    <th>Importe</th>

                    <th>Estado</th>

                    <th>Almacén</th>

                    <th>Cliente</th>

                    <th>Proveedor</th>

                    <th>Factura</th>

                </tr>

            </thead>


            <tbody
                id="tablaDatos">
            </tbody>


        </table>

    </div>


</div>



<script>


/* =========================
   GOOGLE SHEETS
========================= */

const URL =
"https://docs.google.com/spreadsheets/d/e/2PACX-1vTvCxW6aqUhuTwDtYT3ebPkuq36laDtDzYwlV3AuOiO3JlLl5VHpMfeNUNAxCM0sDjbRuLzlX3DROVW/pub?gid=0&single=true&output=csv";


/* =========================
   VARIABLES
========================= */

let datosOriginales = [];

let datosFiltrados = [];


/* =========================
   LIMPIAR VALOR
========================= */

function limpiar(valor){

    if(
        valor === undefined ||
        valor === null
    ){

        return "";

    }

    return valor
        .replace(/^"|"$/g,"")
        .trim();

}


/* =========================
   CARGAR DATOS
========================= */

async function cargarDatos(){

    try{

        const respuesta =
            await fetch(
                URL + "&t=" + Date.now()
            );


        const texto =
            await respuesta.text();


        const filas =
            texto
            .trim()
            .split(/\r?\n/)
            .map(fila => {

                return fila
                .split(
                    /,(?=(?:(?:[^"]*"){2})*[^"]*$)/
                )
                .map(limpiar);

            });


        /*
         * Primera fila = encabezados
         * Resto = información
         */

        datosOriginales =
            filas.slice(1);


        datosFiltrados =
            [...datosOriginales];


        /* Crear opciones de filtros */

        crearFiltros();


        /* Mostrar dashboard */

        actualizarDashboard();


        document.getElementById(
            "cargando"
        ).style.display = "none";


        document.getElementById(
            "tabla"
        ).style.display = "table";


    }
    catch(error){

        console.error(error);

        document.getElementById(
            "cargando"
        ).textContent =
            "Error al cargar los datos.";

    }

}


/* =========================
   CREAR FILTROS
========================= */

function crearFiltros(){


    /*
     * PROVEEDOR
     *
     * cnom_proveedor_c
     * = columna 21
     */

    const proveedores =
        [
            ...new Set(

                datosOriginales

                .map(fila => fila[21])

                .filter(valor =>
                    valor !== ""
                )

            )
        ].sort();


    /*
     * CLIENTE
     *
     * cnom_cliente_v
     * = columna 19
     */

    const clientes =
        [
            ...new Set(

                datosOriginales

                .map(fila => fila[19])

                .filter(valor =>
                    valor !== ""
                )

            )
        ].sort();


    /*
     * ESTADO
     *
     * estado
     * = columna 9
     */

    const estados =
        [
            ...new Set(

                datosOriginales

                .map(fila => fila[9])

                .filter(valor =>
                    valor !== ""
                )

            )
        ].sort();



    /* =========================
       PROVEEDORES
    ========================= */

    const selectProveedor =
        document.getElementById(
            "filtroProveedor"
        );


    proveedores.forEach(proveedor => {

        const opcion =
            document.createElement("option");


        opcion.value =
            proveedor;


        opcion.textContent =
            proveedor;


        selectProveedor.appendChild(
            opcion
        );

    });



    /* =========================
       CLIENTES
    ========================= */

    const selectCliente =
        document.getElementById(
            "filtroCliente"
        );


    clientes.forEach(cliente => {

        const opcion =
            document.createElement("option");


        opcion.value =
            cliente;


        opcion.textContent =
            cliente;


        selectCliente.appendChild(
            opcion
        );

    });



    /* =========================
       ESTADOS
    ========================= */

    const selectEstado =
        document.getElementById(
            "filtroEstado"
        );


    estados.forEach(estado => {

        const opcion =
            document.createElement("option");


        opcion.value =
            estado;


        opcion.textContent =
            estado;


        selectEstado.appendChild(
            opcion
        );

    });

}


/* =========================
   APLICAR FILTROS
========================= */

function aplicarFiltros(){


    const proveedor =
        document.getElementById(
            "filtroProveedor"
        ).value;


    const cliente =
        document.getElementById(
            "filtroCliente"
        ).value;


    const estado =
        document.getElementById(
            "filtroEstado"
        ).value;



    datosFiltrados =
        datosOriginales.filter(fila => {


            /*
             * PROVEEDOR
             * columna 21
             */

            if(
                proveedor &&
                fila[21] !== proveedor
            ){

                return false;

            }


            /*
             * CLIENTE
             * columna 19
             */

            if(
                cliente &&
                fila[19] !== cliente
            ){

                return false;

            }


            /*
             * ESTADO
             * columna 9
             */

            if(
                estado &&
                fila[9] !== estado
            ){

                return false;

            }


            return true;

        });


    actualizarDashboard();

}


/* =========================
   ACTUALIZAR DASHBOARD
========================= */

function actualizarDashboard(){


    let importeTotal = 0;

    let ingresados = 0;

    let modificados = 0;


    datosFiltrados.forEach(fila => {


        /*
         * IMPORTE
         * columna 5
         */

        const importe =
            parseFloat(

                (fila[5] || "")
                .replace(",", ".")

            );


        if(!isNaN(importe)){

            importeTotal += importe;

        }


        /*
         * ESTADO
         * columna 9
         */

        if(
            fila[9] === "Ingresado"
        ){

            ingresados++;

        }


        if(
            fila[9] === "Modificado"
        ){

            modificados++;

        }

    });


    /* DOCUMENTOS */

    document.getElementById(
        "documentos"
    ).textContent =
        datosFiltrados.length;


    /* IMPORTE */

    document.getElementById(
        "importe"
    ).textContent =

        "S/ " +

        importeTotal.toLocaleString(
            "es-PE",
            {
                minimumFractionDigits:2,
                maximumFractionDigits:2
            }
        );


    /* INGRESADOS */

    document.getElementById(
        "ingresados"
    ).textContent =
        ingresados;


    /* MODIFICADOS */

    document.getElementById(
        "modificados"
    ).textContent =
        modificados;


    /* ACTUALIZAR TABLA */

    mostrarTabla();

}


/* =========================
   MOSTRAR TABLA
========================= */

function mostrarTabla(){


    const cuerpo =
        document.getElementById(
            "tablaDatos"
        );


    cuerpo.innerHTML = "";


    datosFiltrados.forEach(fila => {


        const tr =
            document.createElement("tr");


        /*
         * Columnas de la tabla
         */

        const columnas = [

            0,  // cnum_doc
            1,  // ccod_movimiento
            2,  // ctip_movimiento
            3,  // dfecha_doc
            4,  // cmoneda
            5,  // nimporte
            9,  // estado
            10, // ccod_almacen
            19, // cnom_cliente_v
            21, // cnom_proveedor_c
            24  // factura

        ];


        columnas.forEach(indice => {


            const td =
                document.createElement("td");


            let valor =
                fila[indice] || "";


            /*
             * Formato importe
             */

            if(indice === 5){

                const numero =
                    parseFloat(
                        valor.replace(",",".")
                    );


                if(!isNaN(numero)){

                    valor =
                        numero.toLocaleString(
                            "es-PE",
                            {
                                minimumFractionDigits:2,
                                maximumFractionDigits:2
                            }
                        );

                }

            }


            td.textContent =
                valor;


            tr.appendChild(td);

        });


        cuerpo.appendChild(tr);

    });

}


/* =========================
   LIMPIAR FILTROS
========================= */

function limpiarFiltros(){


    document.getElementById(
        "filtroProveedor"
    ).value = "";


    document.getElementById(
        "filtroCliente"
    ).value = "";


    document.getElementById(
        "filtroEstado"
    ).value = "";


    datosFiltrados =
        [...datosOriginales];


    actualizarDashboard();

}


/* =========================
   INICIAR
========================= */

cargarDatos();


</script>

</body>

</html>
```
